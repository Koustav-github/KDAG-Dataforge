[project]
name = "bdh-surgery"
version = "0.1.0"
description = "Train, merge, and export the toy BDH-GPU model pair for the DataForge model-surgery explainer"
readme = "README.md"
authors = [
    { name = "Koustav Manna", email = "koustaviitjee@gmail.com" },
    { name = "Upayan Gupta", email = "upayangupta325@kgpian.iitkgp.ac.in" },
    { name = "Deep Pandey", email = "deeppandey25@kgpian.iitkgp.ac.in" },
    { name = "Tanishq Adhikari", email = "tanishqadhikari202225@kgpian.iitkgp.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
bdh-surgery = "bdh_surgery:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
